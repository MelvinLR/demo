<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartel Extintor</title>
  <link rel="stylesheet" href="stylecartel.css">
</head>
<body>
<a href="index.html">Volver al Index</a>
  <div class="poster">
    <!-- Encabezado Rojo -->
    <header class="header-red">
      <h1>EXTINTOR</h1>
    </header>

    <!-- Subtítulo -->
    <p class="subtitle">USELO UNICAMENTE EN FUEGO CLASE</p>

    <!-- Sección de Clase A -->
    <div class="class-a-section">
      <!-- Triángulo Verde -->
      <div class="triangle-container">
        <svg viewBox="0 0 100 87" class="triangle-svg">
          <polygon points="50,5 95,82 5,82" fill="none" stroke="#006432" stroke-width="8" stroke-linejoin="round"/>
          <text x="50" y="68" font-family="Arial, sans-serif" font-weight="900" font-size="52" fill="#006432" text-anchor="middle">A</text>
        </svg>
      </div>

      <!-- Icono Azul de Solidos Combustibles -->
      <div class="icon-box">
        <svg viewBox="0 0 100 100" class="fire-icon-svg">
          <!-- Bote de basura / Contenedor -->
          <path d="M25 40 L30 85 L50 85 L52 40 Z" fill="#ffffff" />
          <!-- Llamas superiores -->
          <path d="M30 38 Q33 20 37 30 Q42 15 45 38 Z" fill="#ffffff" />
          <path d="M22 38 Q25 25 28 38 Z" fill="#ffffff" />
          <!-- Madera y llamas a la derecha -->
          <rect x="52" y="70" width="30" height="6" fill="#ffffff" rx="2" transform="rotate(-15 67 73)"/>
          <rect x="50" y="76" width="32" height="6" fill="#ffffff" rx="2" transform="rotate(10 66 79)"/>
          <path d="M60 70 Q62 40 70 55 Q78 35 82 70 Z" fill="#ffffff" />
        </svg>
      </div>

      <!-- Descripción de Materiales -->
      <div class="materials-text">
        <strong>SOLIDOS COMBUSTIBLES</strong>
        <span>madera, papel,</span>
        <span>tela, basura</span>
        <span>cartones</span>
      </div>
    </div>

    <!-- Título de Instrucciones -->
    <h2 class="method-title">METODO PARA UTILIZARLO</h2>

    <!-- Lista de Pasos -->
    <ol class="instructions-list">
      <li>Sosténgalo en posición vertical.</li>
      <li>Retire el seguro.</li>
      <li>Oprima la palanca.</li>
      <li>Dirija la descarga contra la base de la llama.</li>
    </ol>

    <!-- Franjas Rojas Inferiores -->
    <div class="bottom-stripes"></div>
  </div>
<script type="module" src="./cartelsScripst.js"></script>
</body>
</html>
